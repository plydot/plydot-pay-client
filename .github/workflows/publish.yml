name: Publish to Maven Central

# Publishes a new Maven Central version on every push/merge to main.
# Other branches never publish.
on:
  push:
    branches:
      - main

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bump patch version
        id: version
        run: |
          set -euo pipefail
          current=$(grep -E '^version = "' build.gradle.kts | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unexpected version format: $current" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next="${major}.${minor}.$((patch + 1))"

          # Prefer next version after the latest git tag when tags exist
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [[ -n "$latest_tag" ]]; then
            tagged="${latest_tag#v}"
            if [[ "$tagged" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              t_major="${BASH_REMATCH[1]}"
              t_minor="${BASH_REMATCH[2]}"
              t_patch="${BASH_REMATCH[3]}"
              candidate="${t_major}.${t_minor}.$((t_patch + 1))"
              # use the higher of build.gradle bump and tag bump
              highest=$(printf '%s\n%s\n' "$next" "$candidate" | sort -V | tail -1)
              next="$highest"
            fi
          fi

          sed -i "s/^version = .*/version = \"$next\"/" build.gradle.kts
          echo "value=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped version to $next"

      - name: Run tests
        run: ./gradlew --no-daemon clean test

      - name: Configure Maven Central + signing credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Trim accidental whitespace/newlines from GitHub secrets (common "Invalid token" cause)
          USER="$(printf '%s' "$MAVEN_CENTRAL_USERNAME" | tr -d '\r\n' | xargs)"
          PASS="$(printf '%s' "$MAVEN_CENTRAL_PASSWORD" | tr -d '\r\n' | xargs)"
          GPG_PASS="$(printf '%s' "$GPG_PASSPHRASE" | tr -d '\r\n')"

          if [[ -z "$USER" || -z "$PASS" ]]; then
            echo "MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD secrets are empty" >&2
            exit 1
          fi
          if [[ -z "$GPG_PRIVATE_KEY" || -z "$GPG_PASS" ]]; then
            echo "GPG_PRIVATE_KEY / GPG_PASSPHRASE secrets are empty" >&2
            exit 1
          fi

          echo "mavenCentralUsername length=${#USER}"
          echo "mavenCentralPassword length=${#PASS}"
          echo "GPG private key lines=$(printf '%s\n' "$GPG_PRIVATE_KEY" | wc -l)"

          # Probe Central Portal token before Gradle upload
          code=$(curl -sS -o /tmp/central_probe.json -w "%{http_code}" \
            -u "${USER}:${PASS}" \
            "https://central.sonatype.com/api/v1/publisher/deployments")
          echo "Central Portal probe HTTP ${code}"
          if [[ "$code" != "200" ]]; then
            echo "Central Portal rejected the token. Regenerate User Token at" >&2
            echo "https://central.sonatype.com/account and update both secrets." >&2
            head -c 300 /tmp/central_probe.json; echo >&2
            exit 1
          fi

          {
            echo "mavenCentralUsername=${USER}"
            echo "mavenCentralPassword=${PASS}"
            echo "signingInMemoryKeyPassword=${GPG_PASS}"
          } > gradle.properties

          # Multiline armored key — keep newlines; strip Windows CR only
          printf '%s\n' "$GPG_PRIVATE_KEY" | tr -d '\r' > signing-key.asc
          if ! grep -q "BEGIN PGP PRIVATE KEY BLOCK" signing-key.asc; then
            echo "GPG_PRIVATE_KEY secret must be the full ASCII-armored private key" >&2
            exit 1
          fi
          # Escape for gradle.properties single-line value: replace newlines with \n
          python3 - <<'PY'
          from pathlib import Path
          key = Path("signing-key.asc").read_text()
          escaped = key.replace("\\", "\\\\").replace("\n", "\\n")
          Path("gradle.properties").write_text(
              Path("gradle.properties").read_text() + f"signingInMemoryKey={escaped}\n"
          )
          PY

      - name: Publish to Maven Central
        run: ./gradlew --no-daemon publishToMavenCentral

      - name: Commit version bump and tag
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build.gradle.kts
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "chore: release v${VERSION} [skip publish]"
          fi

          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"
